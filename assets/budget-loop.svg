<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe4e8" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#275f73"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ed"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="78" font-size="38" font-weight="700" fill="#153441">预算不是一句提示词，而是一笔可核对的账</text><text x="70" y="119" font-size="20" fill="#516c77">原子预留 → 调用 → 有usage结算 / 无usage保留 → 不明费用停止升级</text><rect x="70" y="200" width="300" height="110" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="220.0" y="237" text-anchor="middle" font-size="22" fill="#153441">请求预算 + 项目预算</text><text x="220.0" y="266" text-anchor="middle" font-size="17" fill="#153441">两项都允许才继续</text><rect x="520" y="200" width="300" height="110" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="670.0" y="237" text-anchor="middle" font-size="22" fill="#153441">SQLite 原子预留</text><text x="670.0" y="266" text-anchor="middle" font-size="17" fill="#153441">并发请求共享同一账本</text><rect x="1010" y="200" width="370" height="110" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="1195.0" y="237" text-anchor="middle" font-size="22" fill="#153441">一次有界模型调用</text><text x="1195.0" y="266" text-anchor="middle" font-size="17" fill="#153441">超时限制 / 不自动重试</text><path d="M370 255H520" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 255H1010" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="440" width="390" height="120" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="455.0" y="477" text-anchor="middle" font-size="22" fill="#153441">usage 已知</text><text x="455.0" y="506" text-anchor="middle" font-size="17" fill="#153441">按配置token单价结算</text><text x="455.0" y="535" text-anchor="middle" font-size="17" fill="#153441">实际超出预留仍如实记录</text><rect x="900" y="440" width="430" height="120" rx="18" fill="#fae8d4" stroke="#275f73" stroke-width="2"/><text x="1115.0" y="477" text-anchor="middle" font-size="22" fill="#153441">usage 未知 / 调用失败</text><text x="1115.0" y="506" text-anchor="middle" font-size="17" fill="#153441">保留预留额；停止升级</text><text x="1115.0" y="535" text-anchor="middle" font-size="17" fill="#153441">人工核对后按ID结算</text><path d="M1130 310V365H455V440" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><path d="M1230 310V440" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="650" width="780" height="90" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="750.0" y="687" text-anchor="middle" font-size="22" fill="#153441">报告估算费用与未知费用；本地计算成本另计</text><path d="M455 560V650" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><path d="M1110 560V650" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/></g></svg>