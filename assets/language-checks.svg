<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe4e8" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#275f73"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ed"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="70" y="78" font-size="38" font-weight="700" fill="#153441">多语言覆盖 ≠ 每种语言都已验证准确</text><text x="70" y="119" font-size="20" fill="#516c77">20语言冒烟验证 · 每种1例 · 未根据测试结果调整阈值</text><rect x="70" y="230" width="350" height="130" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="245.0" y="267" text-anchor="middle" font-size="22" fill="#153441">输入 / 20 种语言</text><text x="245.0" y="296" text-anchor="middle" font-size="17" fill="#153441">中 英 法 德 西 葡 意 俄 阿 印</text><text x="245.0" y="325" text-anchor="middle" font-size="17" fill="#153441">日 韩 泰 越 土 印尼 荷 波 乌 瑞</text><rect x="550" y="240" width="350" height="110" rx="18" fill="#e0f2ec" stroke="#275f73" stroke-width="2"/><text x="725.0" y="277" text-anchor="middle" font-size="22" fill="#153441">E5 向量与候选描述</text><text x="725.0" y="306" text-anchor="middle" font-size="17" fill="#153441">候选正确 19 / 20</text><path d="M420 295H550" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><rect x="1060" y="190" width="350" height="110" rx="18" fill="#d9eee3" stroke="#275f73" stroke-width="2"/><text x="1235.0" y="227" text-anchor="middle" font-size="22" fill="#153441">默认阈值接受 13 条</text><text x="1235.0" y="256" text-anchor="middle" font-size="17" fill="#153441">13 条候选正确</text><rect x="1060" y="410" width="350" height="110" rx="18" fill="#fae8d4" stroke="#275f73" stroke-width="2"/><text x="1235.0" y="447" text-anchor="middle" font-size="22" fill="#153441">待复核 7 条</text><text x="1235.0" y="476" text-anchor="middle" font-size="17" fill="#153441">包含 1 条候选误判</text><path d="M900 285H980V245H1060" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 295H980V465H1060" fill="none" stroke="#275f73" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="590" width="1040" height="95" rx="18" fill="#e6edf5" stroke="#275f73" stroke-width="2"/><text x="750.0" y="627" text-anchor="middle" font-size="22" fill="#153441">下一步：使用独立、真实业务样本逐语言验收</text><text x="750.0" y="656" text-anchor="middle" font-size="17" fill="#153441">同时报告接受率、错误率、延迟与费用；不把相似度当概率</text></g></svg>